services:
  - type: web
    name: clientchat-embedder
    env: python
    rootDir: worker
    buildCommand: pip install -r requirements.txt && python -c "from fastembed import TextEmbedding; list(TextEmbedding('sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2', cache_dir='./fastembed_cache').embed(['warmup']))"
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
