name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# These two permissions fix the 403 "Failed to FinalizeArtifact" error
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time — cancel in-progress if a new push arrives
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy index.html to public folder
        run: |
          mkdir -p public
          cp index.html public/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
