# ── Cloud Build — build + deploy backend sur Cloud Run ──────────────────────
#
# Tous les réglages Cloud Run sont codifiés ici.
# NE PAS modifier les settings dans l'UI Cloud Run — un redéploiement les écrase.
#
# Settings clés :
#   --cpu 2 / --memory 8Gi    : sentence-transformers (mpnet + cross-encoder) en mémoire
#   --min-instances 0          : scale-to-zero — 0 € quand personne n'utilise l'app.
#                                Contrepartie : ~80 s de cold start sur la 1re requête
#                                (chargement des 2 modèles). Repasser à 1 coûte ~0,60 $/j.
#   --max-instances 3          : garde-fou coût — usage solo, 3 conteneurs suffisent.
#                                À 20, une boucle pouvait allumer 20×8 GiB d'un coup.
#   --timeout 300              : requêtes longues (digest, sync_drive)
#   --cpu-boost                : CPU max pendant le démarrage du container
#   --concurrency 80           : requêtes simultanées par instance
#
# Registre & région :
#   Projet `clientchat-v2-prod` (créé le 27/08/2026 après la perte de
#   `arctic-rite-497707-s6`). Les images vont dans Artifact Registry, dépôt
#   `clientchat` en europe-west9 (Paris) — gcr.io est un produit déprécié, on
#   ne le recrée pas. Les `gcr.io/cloud-builders/…` ci-dessous sont les images
#   publiques de Google (builders), sans rapport : ne pas les modifier.
#
# Identité & secrets :
#   --service-account / --set-env-vars / --set-secrets sont explicites ci-dessous
#   et doivent le rester. `gcloud run deploy` ne recopie la config de la révision
#   précédente que sur un service DÉJÀ existant ; un service neuf (recréé, ou
#   déployé dans une nouvelle région) démarrerait sans secrets ni identité.

steps:
  # 0. Garde statique — bloque le build sur un nom indéfini
  #
  # Il n'y a pas de framework de test sur ce projet, et `main.py` ne peut pas être
  # importé hors du conteneur (torch + sentence-transformers). Une erreur de nom
  # partait donc directement en production, où le `try/except` large du pipeline RAG
  # la transformait en « aucun document pertinent » : indiscernable d'une abstention
  # légitime. C'est arrivé le 27/08/2026 — un `query_lower` utilisé 130 lignes avant
  # son affectation a tué la recherche documentaire sans un seul symptôme visible.
  #
  # Volontairement limité à `undefined name`, qui est toujours un vrai bug. Le reste
  # de pyflakes (imports inutilisés, f-strings sans placeholder) est du style et ne
  # doit pas pouvoir bloquer un déploiement.
  - name: 'python:3.11-slim'
    entrypoint: bash
    args:
      - '-c'
      - |
        pip install --quiet pyflakes
        # $$ et non $ : Cloud Build réserve $ à ses substitutions et échouerait
        # sur $found avec « key in the template is not a valid built-in substitution ».
        # « invalid syntax » autant que « undefined name » : un fichier que Python ne
        # peut même pas parser est strictement pire qu'un NameError, et pyflakes le
        # signale sous un autre libellé. Le reste (imports inutilisés, f-strings sans
        # placeholder) est du style et ne doit pas bloquer un déploiement.
        found=$$(pyflakes main.py extract_worker.py eval/run_eval.py 2>&1 \
                 | grep -E "undefined name|invalid syntax" || true)
        if [ -n "$$found" ]; then
          echo "✗ noms indéfinis détectés — build interrompu :"
          echo "$$found"
          exit 1
        fi
        echo "✓ aucun nom indéfini"
    dir: 'backend'

  # 1. Build l'image Docker
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'europe-west9-docker.pkg.dev/$PROJECT_ID/clientchat/clientchat-v2', '.']
    dir: 'backend'

  # 2. Push vers le registre
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'europe-west9-docker.pkg.dev/$PROJECT_ID/clientchat/clientchat-v2']

  # 3. Déploie sur Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'clientchat-v2'
      - '--image'
      - 'europe-west9-docker.pkg.dev/$PROJECT_ID/clientchat/clientchat-v2'
      - '--region'
      - 'europe-west9'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      # ── Identité & config runtime ──────────────────────────────────────
      # Explicites volontairement : ils étaient jusqu'ici hérités en silence de
      # la révision précédente. Sur un service recréé, cet héritage n'existe pas
      # et le conteneur démarrerait sans secrets ni compte de service.
      - '--service-account'
      - '${PROJECT_NUMBER}-compute@developer.gserviceaccount.com'
      - '--set-env-vars'
      - 'SUPABASE_URL=https://erpjerfvswesipmdqxab.supabase.co,TRANSFORMERS_OFFLINE=1,HF_DATASETS_OFFLINE=1'
      - '--set-secrets'
      - 'GOOGLE_API_KEY=GOOGLE_API_KEY:latest,SUPABASE_SERVICE_KEY=SUPABASE_SERVICE_KEY:latest,ANTHROPIC_KEY=ANTHROPIC_KEY:latest,GOOGLE_SA_KEY=GOOGLE_SA_KEY:latest'
      # ── Resources ──
      - '--cpu'
      - '2'
      - '--memory'
      - '8Gi'
      # ── Scaling ──
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '3'
      - '--concurrency'
      - '80'
      # ── Timeouts & startup ──
      - '--timeout'
      - '300'
      - '--cpu-boost'

images:
  - 'europe-west9-docker.pkg.dev/$PROJECT_ID/clientchat/clientchat-v2'

options:
  logging: CLOUD_LOGGING_ONLY

# Timeout du build lui-même (docker build + push + deploy)
# 20 min — nécessaire quand toutes les couches Docker sont re-poussées
timeout: '1200s'