steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/clientchat-v2', '.']
    dir: 'backend'
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/clientchat-v2']
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'clientchat-v2'
      - '--image'
      - 'gcr.io/$PROJECT_ID/clientchat-v2'
      - '--region'
      - 'europe-west1'
      - '--platform'
      - 'managed'
      - '--set-secrets'
      - 'SUPABASE_URL=SUPABASE_URL:latest,SUPABASE_SERVICE_KEY=SUPABASE_SERVICE_KEY:latest,ANTHROPIC_KEY=ANTHROPIC_KEY:latest,GOOGLE_SA_KEY=GOOGLE_SA_KEY:latest'

images:
  - 'gcr.io/$PROJECT_ID/clientchat-v2'

options:
  logging: CLOUD_LOGGING_ONLY
