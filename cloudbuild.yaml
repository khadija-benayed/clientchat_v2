steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/clientchat-v2', '.']
    dir: 'backend'
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'clientchat-v2'
      - '--image'
      - 'gcr.io/$PROJECT_ID/clientchat-v2'
      - '--region'
      - 'europe-west1'
      - '--platform'
      - 'managed'
images:
  - 'gcr.io/$PROJECT_ID/clientchat-v2'

options:
  default_logs_bucket_behavior: REGIONAL_USER_OWNED_BUCKET
