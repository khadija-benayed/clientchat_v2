steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/clientchat-v2', '.']
    dir: 'backend'
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/clientchat-v2']
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'clientchat-v2'
      - '--image'
      - 'gcr.io/$PROJECT_ID/clientchat-v2'
      - '--region'
      - 'europe-west1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--timeout'
      - '300'
      - '--cpu'
      - '2'
      - '--memory'
      - '2Gi'
      - '--startup-cpu-boost'

images:
  - 'gcr.io/$PROJECT_ID/clientchat-v2'

options:
  logging: CLOUD_LOGGING_ONLY

timeout: '1200s'
